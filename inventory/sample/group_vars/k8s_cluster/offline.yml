---
## ── Private registries (air-gap) ──────────────────────────────────────
kube_image_repo: "reg.priv.fabe.ir:5000/k8s"
kubeadm_image_repo: "reg.priv.fabe.ir:5000/k8s"
quay_image_repo: "reg.priv.fabe.ir:5001"
cilium_hubble_envoy_image_repo: "reg.priv.fabe.ir:5000/cilium/cilium-envoy"
nginx_image_repo: "reg.priv.fabe.ir:5000/library/nginx"
haproxy_image_repo: "reg.priv.fabe.ir:5000/library/haproxy"

## ── Pinned versions ───────────────────────────────────────────────────
kube_version: "1.35.1"
coredns_version: "1.13.1"

## ── Feature toggles ──────────────────────────────────────────────────
enable_nodelocaldns: true
enable_dns_autoscaler: true

## ── Offline cache paths (relative to project root) ───────────────────
download_cache_dir: "{{ inventory_dir }}/../../offline/cache"
local_release_dir: "{{ inventory_dir }}/../../offline/releases"

## ── Binary download URLs (private proxy) ─────────────────────────────
ciliumcli_download_url: "https://reg.priv.fabe.ir:5001/cilium/cilium-linux-{{ image_arch }}.tar.gz"

## ── Download flags (used by both the builder and the deploy) ──────────
download_run_once: true
download_localhost: true
download_force_cache: true
download_always_pull: false
download_keep_remote_cache: true
download_validate_certs: true
download_skip_local_load: true

## ── Downloads dict (complete override — Ansible does not merge dicts) ─
## Only entries relevant to this deployment are listed.  Disabled runtimes
## (docker, crio, kata, gvisor ...) and disabled addons (calico, argocd,
## helm ...) are intentionally omitted.
downloads:
  # ── Core binaries ────────────────────────────────────────────────────
  etcd:
    container: "{{ etcd_deployment_type != 'host' }}"
    file: "{{ etcd_deployment_type == 'host' }}"
    enabled: true
    dest: "{{ local_release_dir }}/etcd-{{ etcd_version }}-linux-{{ image_arch }}.tar.gz"
    repo: "{{ etcd_image_repo }}"
    tag: "{{ etcd_image_tag }}"
    checksum: >-
      {{ etcd_binary_checksum if (etcd_deployment_type == 'host')
      else etcd_digest_checksum | d(None) }}
    url: "{{ etcd_download_url }}"
    unarchive: "{{ etcd_deployment_type == 'host' }}"
    owner: "{{ ansible_user_id }}"
    mode: "0755"
    groups:
      - etcd

  cni:
    enabled: true
    file: true
    dest: "{{ local_release_dir }}/cni-plugins-linux-{{ image_arch }}-{{ cni_version }}.tgz"
    checksum: "{{ cni_binary_checksum }}"
    url: "{{ cni_download_url }}"
    unarchive: false
    owner: "{{ ansible_user_id }}"
    mode: "0755"
    groups:
      - k8s_cluster

  kubeadm:
    enabled: true
    file: true
    dest: "{{ local_release_dir }}/kubeadm-{{ kube_version }}-{{ image_arch }}"
    checksum: "{{ kubeadm_binary_checksum }}"
    url: "{{ kubeadm_download_url }}"
    unarchive: false
    owner: "{{ ansible_user_id }}"
    mode: "0755"
    groups:
      - k8s_cluster

  kubelet:
    enabled: true
    file: true
    dest: "{{ local_release_dir }}/kubelet-{{ kube_version }}-{{ image_arch }}"
    checksum: "{{ kubelet_binary_checksum }}"
    url: "{{ kubelet_download_url }}"
    unarchive: false
    owner: "{{ ansible_user_id }}"
    mode: "0755"
    groups:
      - k8s_cluster

  kubectl:
    enabled: true
    file: true
    dest: "{{ local_release_dir }}/kubectl-{{ kube_version }}-{{ image_arch }}"
    checksum: "{{ kubectl_binary_checksum }}"
    url: "{{ kubectl_download_url }}"
    unarchive: false
    owner: "{{ ansible_user_id }}"
    mode: "0755"
    groups:
      - kube_control_plane

  crictl:
    enabled: true
    file: true
    dest: "{{ local_release_dir }}/crictl-{{ crictl_version }}-linux-{{ image_arch }}.tar.gz"
    checksum: "{{ crictl_binary_checksum }}"
    url: "{{ crictl_download_url }}"
    unarchive: true
    owner: "{{ ansible_user_id }}"
    mode: "0755"
    groups:
      - k8s_cluster

  # ── Container runtime (containerd only) ──────────────────────────────
  containerd:
    enabled: "{{ container_manager == 'containerd' }}"
    file: true
    dest: "{{ local_release_dir }}/containerd-{{ 'static-' if containerd_static_binary }}{{ containerd_version }}-linux-{{ image_arch }}.tar.gz"
    checksum: "{{ containerd_checksum }}"
    url: "{{ containerd_download_url }}"
    unarchive: false
    owner: "{{ ansible_user_id }}"
    mode: "0755"
    groups:
      - k8s_cluster

  runc:
    enabled: "{{ container_manager == 'containerd' }}"
    file: true
    dest: "{{ local_release_dir }}/runc-{{ runc_version }}.{{ image_arch }}"
    checksum: "{{ runc_binary_checksum }}"
    url: "{{ runc_download_url }}"
    unarchive: false
    owner: "{{ ansible_user_id }}"
    mode: "0755"
    groups:
      - k8s_cluster

  nerdctl:
    enabled: "{{ container_manager == 'containerd' }}"
    file: true
    dest: "{{ local_release_dir }}/nerdctl-{{ nerdctl_version }}-linux-{{ image_arch }}.tar.gz"
    checksum: "{{ nerdctl_archive_checksum }}"
    url: "{{ nerdctl_download_url }}"
    unarchive: true
    owner: "{{ ansible_user_id }}"
    mode: "0755"
    groups:
      - k8s_cluster

  # ── Kubernetes images ────────────────────────────────────────────────
  pod_infra:
    enabled: true
    container: true
    repo: "{{ pod_infra_image_repo }}"
    tag: "{{ pod_infra_image_tag }}"
    checksum: "{{ pod_infra_digest_checksum | default(None) }}"
    groups:
      - k8s_cluster

  coredns:
    enabled: "{{ dns_mode in ['coredns', 'coredns_dual'] }}"
    container: true
    repo: "{{ coredns_image_repo }}"
    tag: "{{ coredns_image_tag }}"
    checksum: "{{ coredns_digest_checksum | default(None) }}"
    groups:
      - k8s_cluster

  nodelocaldns:
    enabled: "{{ enable_nodelocaldns }}"
    container: true
    repo: "{{ nodelocaldns_image_repo }}"
    tag: "{{ nodelocaldns_image_tag }}"
    checksum: "{{ nodelocaldns_digest_checksum | default(None) }}"
    groups:
      - k8s_cluster

  dnsautoscaler:
    enabled: "{{ dns_mode in ['coredns', 'coredns_dual'] and enable_dns_autoscaler }}"
    container: true
    repo: "{{ dnsautoscaler_image_repo }}"
    tag: "{{ dnsautoscaler_image_tag }}"
    checksum: "{{ dnsautoscaler_digest_checksum | default(None) }}"
    groups:
      - kube_control_plane

  # ── Load balancer ────────────────────────────────────────────────────
  nginx:
    enabled: "{{ loadbalancer_apiserver_localhost and loadbalancer_apiserver_type == 'nginx' }}"
    container: true
    repo: "{{ nginx_image_repo }}"
    tag: "{{ nginx_image_tag }}"
    checksum: "{{ nginx_digest_checksum | default(None) }}"
    groups:
      - kube_node

  # ── Cilium (network plugin) ─────────────────────────────────────────
  ciliumcli:
    enabled: "{{ kube_network_plugin == 'cilium' or cilium_deploy_additionally }}"
    file: true
    dest: "{{ local_release_dir }}/cilium-{{ cilium_cli_version }}-{{ image_arch }}.tar.gz"
    checksum: "{{ ciliumcli_binary_checksum }}"
    url: "{{ ciliumcli_download_url }}"
    unarchive: true
    owner: "{{ ansible_user_id }}"
    mode: "0755"
    groups:
      - k8s_cluster

  cilium:
    enabled: "{{ kube_network_plugin == 'cilium' or cilium_deploy_additionally }}"
    container: true
    repo: "{{ cilium_image_repo }}"
    tag: "{{ cilium_image_tag }}"
    checksum: "{{ cilium_digest_checksum | default(None) }}"
    groups:
      - k8s_cluster

  cilium_operator:
    enabled: "{{ kube_network_plugin == 'cilium' or cilium_deploy_additionally }}"
    container: true
    repo: "{{ cilium_operator_image_repo }}"
    tag: "{{ cilium_operator_image_tag }}"
    checksum: "{{ cilium_operator_digest_checksum | default(None) }}"
    groups:
      - k8s_cluster

  cilium_hubble_relay:
    enabled: "{{ cilium_enable_hubble }}"
    container: true
    repo: "{{ cilium_hubble_relay_image_repo }}"
    tag: "{{ cilium_hubble_relay_image_tag }}"
    checksum: "{{ cilium_hubble_relay_digest_checksum | default(None) }}"
    groups:
      - k8s_cluster

  cilium_hubble_certgen:
    enabled: "{{ cilium_enable_hubble }}"
    container: true
    repo: "{{ cilium_hubble_certgen_image_repo }}"
    tag: "{{ cilium_hubble_certgen_image_tag }}"
    checksum: "{{ cilium_hubble_certgen_digest_checksum | default(None) }}"
    groups:
      - k8s_cluster

  cilium_hubble_ui:
    enabled: "{{ cilium_enable_hubble }}"
    container: true
    repo: "{{ cilium_hubble_ui_image_repo }}"
    tag: "{{ cilium_hubble_ui_image_tag }}"
    checksum: "{{ cilium_hubble_ui_digest_checksum | default(None) }}"
    groups:
      - k8s_cluster

  cilium_hubble_ui_backend:
    enabled: "{{ cilium_enable_hubble }}"
    container: true
    repo: "{{ cilium_hubble_ui_backend_image_repo }}"
    tag: "{{ cilium_hubble_ui_backend_image_tag }}"
    checksum: "{{ cilium_hubble_ui_backend_digest_checksum | default(None) }}"
    groups:
      - k8s_cluster

  cilium_hubble_envoy:
    enabled: "{{ cilium_enable_hubble }}"
    container: true
    repo: "{{ cilium_hubble_envoy_image_repo }}"
    tag: "{{ cilium_hubble_envoy_image_tag }}"
    checksum: "{{ cilium_hubble_envoy_digest_checksum | default(None) }}"
    groups:
      - k8s_cluster
