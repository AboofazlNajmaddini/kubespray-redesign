---
all:
  children:
    kube_control_plane:
      hosts:
        builder: &builder
          ansible_connection: local
          # Offline build host: everything lands under ~/offline
          bin_dir: "/home/faraabeen/.local/kubespray-bin"
          kube_config_dir: "/home/faraabeen/.local/kubespray-config"
          download_cache_dir: "/home/faraabeen/offline/cache"
          local_release_dir: "/home/faraabeen/offline/releases"
          # One-time download of all binaries + images to the control host
          download_run_once: true
          download_localhost: true
          download_force_cache: true
          download_always_pull: true
          download_keep_remote_cache: true
          # Cluster runtime is containerd; use docker on this builder to pull/save
          container_manager: containerd
          container_manager_on_localhost: docker
    etcd:
      hosts:
        builder: *builder
    kube_node:
      hosts:
        builder: *builder
    k8s_cluster:
      hosts:
        builder: *builder
